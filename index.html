@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#08090c;--panel:#13151b;--gold:#eac58c;--line:#ffffff1c;--ink:#f4f0e9;--dim:#a9a9af;--green:#a8e3bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid var(--gold)}.grain{position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:radial-gradient(#e9d8ba 0.65px,transparent .65px);background-size:22px 22px}.light{position:fixed;width:50vw;height:50vw;border-radius:50%;background:#bd7e3930;filter:blur(120px);top:-30vw;right:-15vw;animation:drift 15s ease-in-out infinite alternate;pointer-events:none}@keyframes drift{to{transform:translate(-15vw,35vh) scale(1.2)}}.shell{display:grid;grid-template-columns:252px 1fr;height:100dvh}.side{border-right:1px solid var(--line);padding:33px 23px;display:flex;flex-direction:column;background:#0d0e13cf;z-index:5}.wordmark{font-family:Manrope;font-weight:800;letter-spacing:-.05em;font-size:19px}.wordmark span{color:var(--gold)}.sub{color:var(--dim);font-size:11px;line-height:1.6;margin-top:8px}.group{margin-top:45px}.group small{color:var(--gold);font-size:10px;letter-spacing:.17em}.jump{width:100%;text-align:left;padding:12px 10px;border:0;background:transparent;color:#9d9ca2;border-radius:9px;font-size:12px;margin-top:6px;transition:.3s}.jump:hover,.jump.on{background:#eac58c14;color:var(--gold)}.jump span{opacity:.45;margin-right:9px}.side-bottom{margin-top:auto;color:#777d85;font-size:11px;line-height:1.7}.right{min-width:0;display:flex;flex-direction:column;position:relative}.top{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 3.8vw;z-index:2;background:#090a0dbb;backdrop-filter:blur(18px)}.top strong{font-size:12px;letter-spacing:.11em;font-weight:600}.top small{color:var(--dim)}.controls{display:flex;gap:10px;align-items:center}.btn{background:#ffffff0a;border:1px solid #ffffff28;color:var(--ink);border-radius:9px;padding:10px 15px;transition:.25s}.btn:hover{border-color:var(--gold);transform:translateY(-2px)}.btn.gold{background:linear-gradient(120deg,#d5a45d,#f7d99e,#d5a45d);color:#21180e;border:0;font-weight:800;box-shadow:0 7px 25px #dcad6c35}.stage{position:relative;flex:1;overflow:hidden}.slide{position:absolute;inset:0;overflow:auto;padding:clamp(26px,4.5vw,70px);opacity:0;visibility:hidden;transform:translate3d(75px,18px,0) rotateY(-7deg) scale(.97);filter:blur(14px);transition:opacity .75s,transform .85s cubic-bezier(.16,1,.3,1),filter .75s,visibility .75s;perspective:1100px}.slide.active{opacity:1;visibility:visible;transform:none;filter:none;z-index:1}.eyebrow{font-size:11px;letter-spacing:.21em;color:var(--gold);font-weight:800;text-transform:uppercase}.slide h1{font-family:Manrope;font-size:clamp(38px,4.6vw,76px);letter-spacing:-.075em;line-height:1.07;margin:17px 0;font-weight:700}.slide h2{font-family:Manrope;font-size:clamp(30px,3.1vw,52px);letter-spacing:-.06em;line-height:1.13;margin:15px 0}.desc{color:#b9b6b2;font-size:clamp(15px,1.2vw,19px);line-height:1.75;max-width:790px}.hero{display:grid;grid-template-columns:1fr .85fr;gap:5vw;align-items:center;min-height:80%}.glass{background:linear-gradient(135deg,#ffffff13,#ffffff05);border:1px solid #eac58c3a;box-shadow:0 24px 80px #0008,inset 0 1px #ffffff15;backdrop-filter:blur(22px);border-radius:20px;padding:clamp(20px,2.5vw,35px);position:relative;overflow:hidden}.glass:before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,#ffffff09 45%,transparent 60%);transform:translateX(-130%);animation:sheen 9s ease-in-out infinite}@keyframes sheen{40%,100%{transform:translateX(130%)}}.float{animation:float 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px) rotate(.5deg)}}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.tile{border:1px solid #ffffff21;border-radius:13px;padding:19px;background:#ffffff07}.tile strong{display:block;font-size:16px;margin:9px 0}.tile p{color:var(--dim);font-size:13px;line-height:1.65;margin:0}.big-num{font:800 80px Manrope;color:#eac58c20;letter-spacing:-.12em}.flow{display:flex;align-items:center;gap:10px;margin:30px 0;flex-wrap:wrap}.flow .box{flex:1;min-width:140px;border:1px solid #eac58c55;border-radius:12px;padding:20px;background:#ffffff08}.flow .box strong{display:block}.flow .box small{color:var(--dim);display:block;margin-top:9px;line-height:1.5}.flow .arr{color:var(--gold);font-size:23px;animation:blink 2s infinite}@keyframes blink{50%{opacity:.25;transform:translateX(5px)}}.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}.note{color:#c9c1b6;font-size:14px;line-height:1.8}.kicker{font-size:11px;color:var(--gold);letter-spacing:.15em;font-weight:800}.pos{display:grid;grid-template-columns:minmax(0,1fr) 345px;gap:20px;margin-top:25px}.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.product{border:1px solid #ffffff22;background:linear-gradient(150deg,#1b1c22,#111319);color:var(--ink);padding:15px;border-radius:13px;text-align:left;transition:.25s;min-height:150px}.product:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 15px 35px #0008}.product:disabled{opacity:.4;cursor:not-allowed}.product .emoji{font-size:39px;display:block;margin:4px 0 12px;filter:drop-shadow(0 8px 9px #0007)}.product b{display:block;font-size:13px}.product small{display:block;color:var(--gold);margin-top:7px}.cartrow{display:flex;align-items:center;gap:9px;border-bottom:1px solid #ffffff18;padding:12px 0;font-size:12px}.cartrow .name{flex:1}.qty{border:1px solid #ffffff35;border-radius:7px;background:#ffffff10;color:var(--ink);padding:5px 9px}.amount{display:flex;justify-content:space-between;margin:12px 0;font-size:13px}.amount.total{font-size:20px;color:var(--gold);font-weight:800}.receipt{background:#eee9dc;color:#222;padding:18px;border-radius:7px;font:12px/1.8 ui-monospace,monospace;white-space:pre-line;margin-top:16px;box-shadow:0 12px 35px #0007;animation:receipt .5s ease-out}@keyframes receipt{from{transform:translateY(-20px);opacity:0}}.toast{position:fixed;right:25px;bottom:75px;background:#17271e;border:1px solid #75d69a;color:#ddffe5;padding:15px 22px;border-radius:12px;z-index:20;animation:receipt .4s;max-width:360px}.status{color:var(--green);font-size:12px}.doc-tabs{display:flex;flex-wrap:wrap;gap:9px;margin:23px 0}.tab{padding:11px 14px;background:#ffffff09;border:1px solid #ffffff28;border-radius:9px;color:var(--dim);font-size:12px}.tab.active{background:#eac58c20;border-color:var(--gold);color:var(--gold)}.check{display:flex;align-items:center;gap:14px;border-bottom:1px solid #ffffff20;padding:15px 0;font-size:14px}.check input{accent-color:#d8b378;width:18px;height:18px}.bottom{height:60px;border-top:1px solid var(--line);padding:0 3.8vw;display:flex;align-items:center;justify-content:space-between;z-index:3}.bar{height:3px;background:#ffffff25;width:26vw}.bar div{height:100%;background:var(--gold);transition:width .5s}.fine{color:var(--dim);font-size:11px}@media(max-width:1100px){.shell{grid-template-columns:180px 1fr}.side{padding:23px 12px}.pos{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.slide{padding:25px}.catalog{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.shell{display:block}.side{display:none}.top{padding:0 14px}.slide h1{font-size:38px}.split,.grid2{grid-template-columns:1fr}.catalog{grid-template-columns:repeat(2,1fr)}.fine{display:none}.slide{padding:20px}.bottom{padding:0 15px}.top strong{font-size:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="grain"></div><div class="light"></div><div class="shell"><aside class="side"><div class="wordmark">SYSTEM<span> / </span>DESIGN</div><div class="sub">DKB2223</div><div class="group"><small>3.3.3 · PEMPROSESAN</small><div id="nav1"></div></div><div class="group"><small>3.4.1 · SPESIFIKASI</small><div id="nav2"></div></div><div class="side-bottom">Dua tajuk sahaja.<br>Huraian penuh Bahasa Melayu.<br>Tekan ← → untuk tukar paparan.</div></aside><div class="right"><header class="top"><strong id="section">3.3.3 / COMBINED ONLINE AND BATCH PROCESSING</strong><div class="controls"><small id="page">01 / 10</small><button class="btn" id="full">Skrin penuh ↗</button></div></header><main class="stage" id="stage"></main><footer class="bottom"><span class="fine">Nota Kuliah 3 · Analisis & Rekabentuk Sistem</span><div class="bar"><div id="progress"></div></div><div class="controls"><button class="btn" id="prev">←</button><button class="btn" id="next">→</button></div></footer></div></div>

const products=[{id:0,n:'Air Mineral',p:2.00,icon:'💧',stock:20},{id:1,n:'Kopi Tin',p:3.50,icon:'☕',stock:15},{id:2,n:'Roti',p:3.20,icon:'🍞',stock:14},{id:3,n:'Mi Segera',p:4.00,icon:'🍜',stock:12},{id:4,n:'Susu Kotak',p:2.80,icon:'🥛',stock:18},{id:5,n:'Biskut',p:4.50,icon:'🍪',stock:16}];let cart={},transactions=[],reports=[],i=0,tab=0;
const docs=[['Ringkasan Pengurusan','Bahagian ni bagi gambaran keseluruhan projek kepada pengurus dan pihak atasan. Ia ceritakan kerja pembangunan yang dah dibuat, status projek sekarang, jumlah kos, manfaat sistem baharu dan jadual pelaksanaan. Kalau ada masalah atau keputusan penting yang perlukan perhatian pihak pengurusan, semua tu perlu dinyatakan dengan jelas.'],['Komponen Sistem','Bahagian ni menerangkan reka bentuk sistem secara lengkap. Antaranya skrin pengguna, data input dan output, fail, pangkalan data, rangkaian, dokumen sumber, susun atur laporan dan rajah aliran data (DFD). Ia juga perlu terangkan cara buat sandaran dan pulihkan data, proses permulaan sistem serta cara simpan rekod. Kalau sistem guna perisian yang dibeli, cara perisian itu berhubung dengan sistem baharu pun kena diterangkan.'],['Persekitaran Sistem','Bahagian ni terangkan keadaan dan had yang boleh mempengaruhi sistem. Contohnya jumlah transaksi yang sistem kena mampu terima, ruang simpanan data, masa untuk menjalankan proses, tarikh akhir laporan dan berapa cepat sistem perlu memberi respons. Keperluan komputer, perisian sistem, rangkaian dan keselamatan juga termasuk dalam bahagian ni.'],['Keperluan Pelaksanaan','Bahagian ni menjelaskan persediaan sebelum sistem mula digunakan. Antaranya proses awal sistem, cara masukkan atau pindahkan data sedia ada, latihan untuk pengguna dan rancangan ujian perisian. Tujuannya supaya pengguna bersedia dan sistem dapat diuji sebelum digunakan untuk kerja sebenar.'],['Anggaran Masa dan Kos','Bahagian ni menyenaraikan jadual kerja yang terperinci, anggaran perbelanjaan dan jumlah pekerja yang diperlukan untuk pembangunan sistem. Ia juga mengemas kini jangkaan masa dan kos bagi baki fasa SDLC, kemudian membandingkan jumlah kos terkini dengan anggaran yang dibuat sebelum ini.'],['Bahan Tambahan','Bahagian terakhir digunakan untuk letak dokumen sokongan yang boleh membantu pembaca memahami spesifikasi. Contohnya bahan berkaitan daripada fasa analisis atau reka bentuk sebelum ini. Bahan tambahan hanya dimasukkan kalau memang berguna untuk menerangkan sistem.']];
const slides=[
['3.3.3','Konsep gabungan',`<div class="hero"><div><div class="eyebrow">3.3.3 · Combined Online and Batch Processing</div><h1>Dua cara proses.<br><span style="color:var(--gold)">Satu sistem.</span></h1><p class="desc">Sistem guna pemprosesan dalam talian untuk kerja yang perlu siap terus, dan pemprosesan berkumpulan untuk kerja yang boleh dikumpulkan dan dibuat kemudian.</p><p class="note">Contoh paling senang: kedai runcit. Masa pelanggan bayar, sistem terus kira harga dan tolak stok. Bila kedai tutup, sistem kumpulkan semua rekod jualan tadi untuk buat laporan jualan harian, rekod perakaunan dan tengok barang mana yang paling laris atau kurang mendapat sambutan.</p></div><div class="glass float"><div class="kicker">DUA LALUAN PROSES</div><div class="grid2" style="margin-top:20px"><div class="tile"><div class="big-num">01</div><strong>Dalam talian</strong><p>Jualan, semak stok dan cetak resit dibuat terus.</p></div><div class="tile"><div class="big-num">02</div><strong>Berkumpulan</strong><p>Data jualan yang terkumpul diproses serentak untuk buat laporan harian, catatan perakaunan dan analisis jualan. Cara ni tak memerlukan jurujual buat setiap laporan satu per satu.</p></div></div></div></div>`],
['3.3.3','Aliran pemprosesan',`<div class="eyebrow">3.3.3 · ALIRAN KERJA</div><h2>Apa jadi bila pelanggan membeli?</h2><p class="desc">Dua proses ni saling berkait, tapi dibuat pada masa yang berbeza.</p><div class="flow"><div class="box"><strong>🛒 Pelanggan bayar</strong><small>Jurujual masukkan barang dalam terminal POS.</small></div><div class="arr">→</div><div class="box"><strong>⚡ Proses terus</strong><small>Kira jumlah, sahkan jualan, tolak stok, cetak resit.</small></div><div class="arr">→</div><div class="box"><strong>🗃️ Simpan rekod</strong><small>Maklumat jualan direkod untuk kegunaan kemudian.</small></div><div class="arr">→</div><div class="box"><strong>📊 Proses rekod akhir hari</strong><small>Hasilkan laporan dan rekod perakaunan.</small></div></div><div class="glass"><div class="kicker">KENAPA GUNA CARA NI?</div><p class="note">Pelanggan boleh terus dapat jumlah bayaran dan resit sebab proses jualan berlaku pada masa itu juga. Setiap transaksi turut disimpan sebagai rekod. Bila kedai tutup, sistem proses rekod yang terkumpul untuk hasilkan laporan jualan, kemas kini maklumat perakaunan dan kenal pasti barang yang cepat atau lambat terjual.</p></div>`],
['3.3.3','Simulasi POS',`<div class="eyebrow">3.3.3 · SIMULASI KEDAI RUNCIT</div><h2>Cuba buat jualan sebenar.</h2><p class="desc">Pilih barang, ubah kuantiti, bayar dan dapat resit. Stok akan terus berkurang. Semua transaksi boleh dijadikan laporan bila kau tekan <b>Tutup Hari</b>.</p><div class="pos"><div class="glass"><div class="kicker">PILIH BARANG · SISTEM POS</div><div class="catalog" id="catalog" style="margin-top:17px"></div><div class="note" style="margin-top:14px">Simulasi ni berjalan dalam browser sahaja. Tak melibatkan duit atau pesanan sebenar.</div></div><div class="glass"><div class="kicker">BAKUL BELIAN</div><div id="cart" style="margin-top:14px;min-height:80px"></div><div id="totals"></div><button class="btn gold" id="pay" style="width:100%;margin-top:15px">Selesaikan Bayaran</button><div id="receipt"></div></div></div>`],
['3.3.3','Proses berkumpulan',`<div class="eyebrow">3.3.3 · LAPORAN AKHIR HARI</div><h2>Kedai dah tutup.<br>Apa sistem buat?</h2><p class="desc">Sepanjang hari, jurujual masukkan jualan melalui terminal POS. Setiap transaksi terus dikira, stok dikemas kini dan resit dikeluarkan. Pada masa yang sama, rekod jualan disimpan. Bila kedai ditutup, semua rekod yang belum dimasukkan dalam laporan akan diproses bersama-sama untuk kira jumlah jualan, buat catatan perakaunan dan kenal pasti barang paling laris.</p><div class="split" style="margin-top:28px"><div class="glass"><div class="kicker">REKOD JUALAN TERKUMPUL</div><div id="batchlist" class="note" style="margin-top:20px"></div><button class="btn gold" id="runBatch" style="margin-top:20px">Proses Rekod & Jana Laporan</button></div><div class="glass"><div class="kicker">HASIL PROSES DATA BERKUMPULAN</div><div id="batchresult" class="note" style="margin-top:20px">Belum ada laporan. Buat jualan dekat simulasi POS dulu.</div></div></div>`],
['3.3.3','Kelebihan dan kekurangan',`<div class="eyebrow">3.3.3 · PENILAIAN</div><h2>Kenapa dua-dua kaedah digunakan?</h2><div class="grid2" style="margin-top:30px"><div class="glass"><div class="kicker">KELEBIHAN</div><div class="tile" style="margin-top:17px"><strong>Maklumat sentiasa terkini</strong><p>Bila jurujual masukkan transaksi, sistem terus buat pengiraan, sahkan maklumat dan kemas kini rekod stok. Sebab itu baki stok dan maklumat jualan sentiasa terkini sepanjang waktu kedai beroperasi.</p></div><div class="tile" style="margin-top:12px"><strong>Kerja rutin lebih tersusun</strong><p>Kerja rutin seperti laporan harian, rekod perakaunan dan analisis trend jualan boleh dijalankan mengikut jadual selepas kedai tutup. Sistem tak perlu tunggu jurujual masukkan arahan untuk setiap laporan.</p></div></div><div class="glass"><div class="kicker">CABARAN</div><div class="tile" style="margin-top:17px"><strong>Kos sistem boleh meningkat</strong><p>Kalau terlalu banyak transaksi berlaku pada masa yang sama, syarikat kecil mungkin perlu keluarkan kos lebih tinggi untuk komputer, rangkaian dan sistem yang mampu menampung semua transaksi.</p></div><div class="tile" style="margin-top:12px"><strong>Sandaran dan pemulihan</strong><p>Sistem perlu ada cara buat salinan sandaran dan pulihkan data kalau berlaku kerosakan. Nota kuliah terangkan kos sandaran dan pemulihan juga boleh menambahkan perbelanjaan IT.</p></div></div></div>`],
['3.4.1','Maksud spesifikasi',`<div class="hero"><div><div class="eyebrow">3.4.1 · System Design Specification</div><h1>Pelan lengkap<br><span style="color:var(--gold)">sebelum bina sistem.</span></h1><p class="desc">Spesifikasi reka bentuk sistem ialah dokumen lengkap yang menerangkan reka bentuk sistem maklumat baharu. Dokumen ni bukan sekadar tunjuk rupa skrin, tapi turut masukkan cara sistem berfungsi, kos projek, jumlah pekerja yang diperlukan dan jadual untuk menyiapkan fasa pelaksanaan sistem.</p><p class="note">Dokumen ni jadi rujukan utama pengatur cara semasa membina program. Ia juga digunakan sebagai ukuran untuk semak sistem yang siap nanti. Berbeza dengan dokumen keperluan yang lebih mudah difahami pengguna, spesifikasi ni lebih terperinci dari segi teknikal. Antara bahan yang boleh dimasukkan ialah huraian proses, kamus data dan rajah aliran data (DFD).</p></div><div class="glass float"><div class="kicker">KANDUNGAN UTAMA</div><div class="grid2" style="margin-top:20px">${docs.slice(0,4).map((d,n)=>`<div class="tile"><div class="big-num" style="font-size:48px">0${n+1}</div><strong>${d[0]}</strong></div>`).join('')}</div></div></div>`],
['3.4.1','Enam bahagian dokumen',`<div class="eyebrow">3.4.1 · STRUKTUR SPESIFIKASI</div><h2>Enam bahagian penting.</h2><p class="desc">Pilih mana-mana bahagian untuk baca penerangan yang lebih lengkap. Mengikut Nota Kuliah 3, spesifikasi perlu disusun dengan teratur dan biasanya ada muka depan, isi kandungan serta indeks. Kandungan sebenar bergantung pada cara syarikat bekerja dan tahap kerumitan sistem.</p><div class="doc-tabs" id="tabs"></div><div class="glass" id="doccontent" style="min-height:210px"></div>`],
['3.4.1','Contoh dokumen',`<div class="eyebrow">3.4.1 · CONTOH PENGGUNAAN</div><h2>Contoh: sistem jualan kedai.</h2><p class="desc">Sebagai contoh tambahan untuk mudahkan pemahaman, kalau kita nak bina sistem POS macam simulasi tadi, dokumen spesifikasi perlu nyatakan reka bentuk skrin, cara jualan dikira, data yang disimpan, laporan yang diperlukan, keperluan keselamatan, latihan jurujual serta rancangan ujian sebelum sistem digunakan.</p><div class="grid2" style="margin-top:24px"><div class="tile"><div class="kicker">ANTARA MUKA</div><strong>Skrin jualan & bayaran</strong><p>Skrin perlu tunjuk nama barang, harga, kuantiti, jumlah bayaran dan resit. Dokumen juga perlu terangkan susunan input, output dan cara pengguna bergerak antara skrin.</p></div><div class="tile"><div class="kicker">DATA</div><strong>Stok & transaksi</strong><p>Sistem simpan maklumat barang, baki stok, transaksi jualan dan rekod harian. Reka bentuk pangkalan data, fail dan hubungan antara data perlu dijelaskan.</p></div><div class="tile"><div class="kicker">PROSES</div><strong>Dalam talian + berkumpulan</strong><p>Bila jurujual buat jualan, sistem terus kira dan tolak stok. Rekod jualan pula dikumpulkan untuk laporan harian, catatan perakaunan dan analisis selepas kedai tutup.</p></div><div class="tile"><div class="kicker">PELAKSANAAN</div><strong>Ujian & latihan</strong><p>Rancang ujian pengiraan harga, semakan resit, sandaran data dan latihan jurujual. Sediakan juga jadual kerja, anggaran kos dan keperluan pekerja.</p></div></div>`],
['3.4.1','Kesimpulan',`<div class="hero"><div><div class="eyebrow">RUMUSAN · 3.3.3 + 3.4.1</div><h1>Proses yang betul.<br><span style="color:var(--gold)">Reka bentuk yang jelas.</span></h1><p class="desc">3.3.3 menerangkan cara pemprosesan dalam talian digunakan semasa transaksi berlaku, manakala data yang terkumpul diproses bersama-sama mengikut jadual. 3.4.1 pula menerangkan dokumen lengkap yang digunakan oleh pengatur cara untuk membina sistem, termasuk reka bentuk, kos, kakitangan dan jadual pelaksanaan.</p><p class="note">Contoh kedai runcit: jualan dan stok diproses terus, laporan dijana pada akhir hari, kemudian semua keperluan sistem didokumenkan dalam spesifikasi reka bentuk.</p></div><div class="glass float"><div class="kicker">INGAT DUA PERKARA</div><div class="tile" style="margin-top:17px"><strong>3.3.3</strong><p>Transaksi jualan dikira terus, stok dikemas kini dan resit dicetak. Rekod terkumpul diproses selepas kedai tutup untuk hasilkan laporan dan analisis.</p></div><div class="tile" style="margin-top:15px"><strong>3.4.1</strong><p>Spesifikasi jadi panduan pengatur cara dan ukuran untuk menilai sistem yang siap, lengkap dengan enam bahagian penting seperti dalam nota.</p></div></div></div>`]
];
const stage=document.getElementById('stage');stage.innerHTML=slides.map(s=>`<section class="slide">${s[2]}</section>`).join('');const els=[...document.querySelectorAll('.slide')];function nav(){for(let group=0;group<2;group++){document.getElementById('nav'+(group+1)).innerHTML=slides.map((s,n)=>({s,n})).filter(x=>group===0?x.n<5:x.n>=5).map(({s,n})=>`<button class="jump ${n===i?'on':''}" data-go="${n}"><span>${String(n+1).padStart(2,'0')}</span>${s[1]}</button>`).join('')}}function show(n){i=Math.max(0,Math.min(slides.length-1,n));els.forEach((el,k)=>el.classList.toggle('active',k===i));document.getElementById('page').textContent=String(i+1).padStart(2,'0')+' / '+slides.length;document.getElementById('section').textContent=slides[i][0]+' / '+(i<5?'COMBINED ONLINE AND BATCH PROCESSING':'SYSTEM DESIGN SPECIFICATION');document.getElementById('progress').style.width=(i+1)/slides.length*100+'%';nav()}document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go)show(+go.dataset.go)});document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(['ArrowRight','PageDown'].includes(e.key))show(i+1);if(['ArrowLeft','PageUp'].includes(e.key))show(i-1);if(e.key.toLowerCase()==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()});function money(n){return 'RM'+n.toFixed(2)}function toast(msg){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.append(d);setTimeout(()=>d.remove(),3200)}
function draw(){document.getElementById('catalog').innerHTML=products.map(x=>`<button class="product" data-add="${x.id}" ${x.stock-(cart[x.id]||0)<=0?'disabled':''}><span class="emoji">${x.icon}</span><b>${x.n}</b><small>${money(x.p)} · Stok ${x.stock}</small></button>`).join('');let ids=Object.keys(cart).filter(k=>cart[k]>0);document.getElementById('cart').innerHTML=ids.length?ids.map(k=>{let x=products[k];return `<div class="cartrow"><span>${x.icon}</span><span class="name">${x.n}<br><small>${money(x.p)}</small></span><button class="qty" data-minus="${k}">−</button>${cart[k]}<button class="qty" data-add="${k}">+</button><b>${money(x.p*cart[k])}</b></div>`}).join(''):'<div class="note">Belum pilih barang. Tekan barang di sebelah kiri untuk tambah ke bakul.</div>';let subtotal=ids.reduce((a,k)=>a+products[k].p*cart[k],0);document.getElementById('totals').innerHTML=`<div class="amount"><span>Jumlah kecil</span><b>${money(subtotal)}</b></div><div class="amount total"><span>Jumlah bayar</span><span>${money(subtotal)}</span></div>`}
document.addEventListener('click',e=>{let a=e.target.closest('[data-add]'),m=e.target.closest('[data-minus]');if(a){let id=+a.dataset.add;if((cart[id]||0)<products[id].stock)cart[id]=(cart[id]||0)+1;else toast('Stok barang tak mencukupi.');draw()}if(m){let id=+m.dataset.minus;cart[id]=Math.max(0,(cart[id]||0)-1);draw()}});
document.getElementById('pay').onclick=()=>{let ids=Object.keys(cart).filter(k=>cart[k]>0);if(!ids.length)return toast('Pilih barang dulu sebelum bayar.');let total=ids.reduce((a,k)=>a+products[k].p*cart[k],0);let items=ids.map(k=>({id:+k,qty:cart[k],name:products[k].n,price:products[k].p}));items.forEach(x=>products[x.id].stock-=x.qty);let sale={id:transactions.length+1,items,total,time:new Date().toLocaleTimeString('ms-MY')};transactions.push(sale);document.getElementById('receipt').innerHTML=`<div class="receipt">KEDAI RUNCIT DEMO\n----------------------------\nRESIT #${String(sale.id).padStart(4,'0')} · ${sale.time}\n${items.map(x=>`${x.name} × ${x.qty}   ${money(x.qty*x.price)}`).join('\n')}\n----------------------------\nJUMLAH: ${money(total)}\nSTATUS: BAYARAN BERJAYA\nStok telah dikemas kini.</div>`;cart={};draw();refreshBatch();toast('Bayaran berjaya! Stok dah dikemas kini dan resit siap.');};
function refreshBatch(){let pending=transactions.filter(x=>!x.reported);document.getElementById('batchlist').innerHTML=pending.length?pending.map(x=>`<div class="cartrow"><span class="name">Resit #${String(x.id).padStart(4,'0')} · ${x.time}</span><b>${money(x.total)}</b></div>`).join(''):`Tiada transaksi baharu untuk laporan. ${transactions.length?'Semua jualan dah diproses.':'Pergi ke simulasi POS dan buat jualan dulu.'}`}
document.getElementById('runBatch').onclick=()=>{let pending=transactions.filter(x=>!x.reported);if(!pending.length)return toast('Belum ada jualan baharu untuk diproses.');let total=pending.reduce((a,x)=>a+x.total,0),count=pending.length;pending.forEach(x=>x.reported=true);let counts={};pending.forEach(s=>s.items.forEach(x=>counts[x.name]=(counts[x.name]||0)+x.qty));let popular=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];reports.push({count,total});document.getElementById('batchresult').innerHTML=`<div class="status">● LAPORAN BERJAYA DIJANA</div><div class="big-num" style="font-size:55px">${money(total)}</div><div class="amount"><span>Bilangan transaksi</span><b>${count}</b></div><div class="amount"><span>Barang paling banyak dijual</span><b>${popular[0]} (${popular[1]})</b></div><div class="amount"><span>Jumlah laporan dijana</span><b>${reports.length}</b></div><p class="note">Contoh pemprosesan berkumpulan: sistem kumpul rekod jualan, kira jumlah dan kenal pasti barang paling laris.</p>`;refreshBatch();toast('Laporan akhir hari dah siap!')};
function renderTab(){document.getElementById('tabs').innerHTML=docs.map((x,n)=>`<button class="tab ${n===tab?'active':''}" data-tab="${n}">0${n+1} · ${x[0]}</button>`).join('');document.getElementById('doccontent').innerHTML=`<div class="kicker">BAHAGIAN 0${tab+1} / 06</div><h2 style="font-size:30px">${docs[tab][0]}</h2><p class="desc">${docs[tab][1]}</p>`}document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){tab=+t.dataset.tab;renderTab()}});renderTab();draw();refreshBatch();show(0);
</script></body></html>
